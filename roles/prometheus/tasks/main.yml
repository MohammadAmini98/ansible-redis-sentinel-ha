---
- name: Validate Prometheus topology
  ansible.builtin.assert:
    that:
      - groups['monitoring_server'] | default([]) | length == 1
      - groups['redis_cluster'] | default([]) | length > 0
      - hostvars[item].ansible_host is defined
    fail_msg: "Define exactly one monitoring server and an advertised IP for every Redis host."
  loop: "{{ groups['redis_cluster'] | default([]) }}"

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ prometheus_base_dir }}", owner: "root", group: "root", mode: "0755"}
    - {path: "{{ prometheus_base_dir }}/config", owner: "root", group: "root", mode: "0755"}
    - {path: "{{ prometheus_base_dir }}/data", owner: "65534", group: "65534", mode: "0750"}

- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_base_dir }}/config/prometheus.desired.yml"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Render Prometheus file-discovery targets
  ansible.builtin.template:
    src: targets.yml.j2
    dest: "{{ prometheus_base_dir }}/config/targets.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull the Prometheus image
  community.docker.docker_image:
    name: "{{ prometheus_image }}"
    source: pull
    force_source: false

- name: Validate the desired Prometheus configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/promtool
      - -v
      - "{{ prometheus_base_dir }}/config:/etc/prometheus:ro"
      - "{{ prometheus_image }}"
      - check
      - config
      - /etc/prometheus/prometheus.desired.yml
  changed_when: false
  when: not ansible_check_mode

- name: Install the validated Prometheus configuration
  ansible.builtin.copy:
    src: "{{ prometheus_base_dir }}/config/prometheus.desired.yml"
    dest: "{{ prometheus_base_dir }}/config/prometheus.yml"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Start Prometheus
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image }}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time={{ prometheus_retention_time }}"
      - "--storage.tsdb.retention.size={{ prometheus_retention_size }}"
      - "--config.auto-reload-interval={{ prometheus_config_auto_reload_interval }}"
      - "--web.listen-address={{ prometheus_listen_address }}:{{ prometheus_port }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    user: "{{ prometheus_container_user }}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    memory: "{{ prometheus_container_memory }}"
    cpus: "{{ prometheus_container_cpus }}"
    pids_limit: "{{ prometheus_container_pids_limit }}"
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
    stop_timeout: "{{ prometheus_container_stop_timeout }}"
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options }}"
    volumes:
      - "{{ prometheus_base_dir }}/config:/etc/prometheus:ro"
      - "{{ prometheus_base_dir }}/data:/prometheus"
    comparisons:
      image: strict
      command: strict
      volumes: strict

- name: Wait for Prometheus readiness
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen_address }}:{{ prometheus_port }}/-/ready"
    status_code: 200
  register: prometheus_ready
  changed_when: false
  retries: 20
  delay: 3
  until: prometheus_ready.status == 200
  when: not ansible_check_mode

- name: Wait until every expected target is UP
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen_address }}:{{ prometheus_port }}/api/v1/targets"
    method: GET
    return_content: true
    status_code: 200
  register: prometheus_targets
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    prometheus_targets.json is defined
    and prometheus_targets.json.data.activeTargets
        | selectattr('health', 'equalto', 'up') | list | length
        == (groups['redis_cluster'] | length * 3 + 1)
  when: not ansible_check_mode

- name: Verify every Redis and Sentinel exporter reports a live backend
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen_address }}:{{ prometheus_port }}/api/v1/query?query=count(redis_up%20%3D%3D%201)"
    return_content: true
    status_code: 200
  register: prometheus_redis_up
  changed_when: false
  retries: 10
  delay: 3
  until: >-
    prometheus_redis_up.json.data.result | length == 1
    and prometheus_redis_up.json.data.result[0].value[1] | int
        == groups['redis_cluster'] | length * 2
  when: not ansible_check_mode

- name: Verify Node Exporter metrics exist for every host
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen_address }}:{{ prometheus_port }}/api/v1/query?query=count(node_uname_info)"
    return_content: true
    status_code: 200
  register: prometheus_node_up
  changed_when: false
  retries: 10
  delay: 3
  until: >-
    prometheus_node_up.json.data.result | length == 1
    and prometheus_node_up.json.data.result[0].value[1] | int
        == groups['redis_cluster'] | length
  when: not ansible_check_mode
